<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAU Owls Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Shrikhand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <header class="site-header">
      <div class="brand">
        <div class="brand-badge">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </div>
        <div class="brand-text">
          <h1>FAU Owls Weather</h1>
          <p>Emma's Forecast • Boca Raton, FL</p>
        </div>
      </div>
      <button id="theme-toggle" class="icon-btn theme-btn" aria-label="Switch to dark mode">
        <svg class="moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
        <svg class="sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <form id="search-form" class="controls card" aria-label="Search and units">
      <div class="unit-toggle" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="F" aria-pressed="true">°F</button>
        <button type="button" data-unit="C" aria-pressed="false">°C</button>
      </div>
      <label for="city-search" class="sr-only">Search for a city</label>
      <div class="search-field">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="city-search" type="text" placeholder="Search for a city" autocomplete="off">
      </div>
      <button type="submit" class="btn-primary search-btn">Search</button>
      <button type="button" id="locate-btn" class="btn-outline locate-btn" aria-label="Use my location">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>My Location</span>
      </button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>

    <section class="current" aria-label="Current conditions">
      <div class="hero dots">
        <div class="hero-top">
          <div class="hero-place">
            <p class="eyebrow">Right now in</p>
            <h2 id="place">Boca Raton, FL</h2>
          </div>
          <div id="local-time" class="time-pill">—</div>
        </div>
        <div class="hero-main">
          <div id="hero-icon" class="hero-icon"></div>
          <div class="hero-reading">
            <div class="temp"><span id="temp">--</span>°<span id="unit" class="temp-unit">F</span></div>
            <p id="condition" class="condition">Loading…</p>
          </div>
        </div>
      </div>

      <div class="details">
        <div class="stat card">
          <div class="stat-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg></div>
          <p class="stat-label">Feels Like</p>
          <p class="stat-value"><span id="feels">--</span>°</p>
        </div>
        <div class="stat card">
          <div class="stat-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.3 0z"/></svg></div>
          <p class="stat-label">Humidity</p>
          <p class="stat-value"><span id="humidity">--</span>%</p>
        </div>
        <div class="stat card">
          <div class="stat-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7A2.5 2.5 0 1 1 19.5 12H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/></svg></div>
          <p class="stat-label">Wind</p>
          <p class="stat-value"><span id="wind">--</span> <small id="wind-unit">mph</small></p>
        </div>
        <div class="stat card">
          <div class="stat-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12a10 10 0 0 0-20 0z"/><path d="M12 12v8a2 2 0 0 0 4 0"/></svg></div>
          <p class="stat-label">Precipitation</p>
          <p class="stat-value"><span id="precip">--</span> <small id="precip-unit">in</small></p>
        </div>
        <div class="tip">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
          <p><strong>Outfit tip:</strong> <span id="tip">Checking the sky…</span></p>
        </div>
      </div>
    </section>

    <section class="forecast" aria-labelledby="fc-title">
      <h3 id="fc-title">7-Day Forecast</h3>
      <div id="days" class="days"></div>
    </section>

    <footer class="site-footer">
      <p>Weather data by <a href="https://open-meteo.com/">Open-Meteo</a></p>
      <p class="made-for">Made for Emma • Go Owls!</p>
    </footer>

  </div>
  <script src="app.js"></script>
</body>
</html>
